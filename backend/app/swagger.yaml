openapi: 3.0.0
info:
  title: API Inventario Forestal JBV3
  description: |
    Sistema de gestión de inventario forestal con servicios ecosistémicos para JARBOTAV3.
    
    ## Funcionalidades principales
    - **Autenticación**: Login con JWT.
    - **Usuarios**: CRUD completo (solo administradores).
    - **Especies**: CRUD completo.
    - **Árboles**: CRUD, mapa, subida de imágenes y cálculos automáticos (biomasa, carbono, CO₂e, área basal, volumen).
    - **Atributos dinámicos**: Gestión de campos adicionales para árboles.
    - **Reportes**: 6 endpoints de estadísticas.
    - **Exportación Darwin Core**: Compatible con GBIF y SiB Colombia (JSON y CSV).
    - **NDVI**: Cálculo del Índice de Vegetación de Diferencia Normalizada usando Sentinel-2.
    - **Administración**: Estructura de tablas para gestión de campos.
  version: 3.0.0
  contact:
    name: Soporte JBV3
    email: soporte@jbv3.com
servers:
  - url: http://localhost:8001
    description: Servidor Localhost
  - url: http://127.0.0.1:8001
    description: Servidor de Desarrollo Loopback
  - url: http://192.168.100.109:8001
    description: Servidor en Red Local (LAN)
security:
  - X-UsuarioID: []
  - BearerAuth: []

paths:
  # ============================================================
  # AUTENTICACIÓN
  # ============================================================
  /auth/login:
    post:
      summary: Iniciar sesión
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, contrasena]
              properties:
                usuario:
                  type: string
                  example: adminjbitp
                contrasena:
                  type: string
                  example: Admin@itp
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Token JWT
                  UsuarioID:
                    type: integer
                  usuario:
                    type: string
                  Rol:
                    type: string
        '401':
          description: Credenciales inválidas

  # ============================================================
  # USUARIOS (solo administradores)
  # ============================================================
  /usuarios:
    get:
      summary: Obtener todos los usuarios
      tags: [Usuarios]
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
    post:
      summary: Crear un nuevo usuario
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Usuario, Contrasena]
              properties:
                Usuario:
                  type: string
                Contrasena:
                  type: string
                RolID:
                  type: integer
                  default: 1
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExito'

  /usuarios/{usuario_id}:
    put:
      summary: Actualizar un usuario
      tags: [Usuarios]
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Usuario:
                  type: string
                Contrasena:
                  type: string
                RolID:
                  type: integer
      responses:
        '200':
          description: Usuario actualizado
    delete:
      summary: Eliminar un usuario
      tags: [Usuarios]
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario eliminado

  # ============================================================
  # ESPECIES
  # ============================================================
  /especies:
    get:
      summary: Obtener todas las especies
      tags: [Especies]
      responses:
        '200':
          description: Lista de especies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Especie'
    post:
      summary: Crear una nueva especie
      tags: [Especies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [NombreComun, NombreCientifico, Categoria]
              properties:
                NombreComun:
                  type: string
                  example: Cedro
                NombreCientifico:
                  type: string
                  example: Cedrela odorata
                Familia:
                  type: string
                  example: Meliaceae
                Categoria:
                  type: string
                  enum: [Parcela, Sendero]
                  example: Parcela
      responses:
        '201':
          description: Especie creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExito'

  /especies/{especie_id}:
    get:
      summary: Obtener una especie por ID
      tags: [Especies]
      parameters:
        - name: especie_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Especie encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especie'
        '404':
          description: Especie no encontrada
    put:
      summary: Actualizar una especie
      tags: [Especies]
      parameters:
        - name: especie_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NombreComun:
                  type: string
                NombreCientifico:
                  type: string
                Familia:
                  type: string
                Categoria:
                  type: string
      responses:
        '200':
          description: Especie actualizada
    delete:
      summary: Eliminar una especie
      tags: [Especies]
      parameters:
        - name: especie_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Especie eliminada

  # ============================================================
  # ÁRBOLES
  # ============================================================
  /arboles:
    get:
      summary: Obtener todos los árboles
      tags: [Árboles]
      responses:
        '200':
          description: Lista de árboles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Arbol'
    post:
      summary: Crear un nuevo árbol (con cálculos automáticos)
      tags: [Árboles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [EspecieID, NumeroArbol, EstadoSanitario]
              properties:
                EspecieID:
                  type: integer
                NumeroArbol:
                  type: string
                Factor:
                  type: number
                CAP_Cm:
                  type: number
                CAP_M:
                  type: number
                DAP_M:
                  type: number
                AlturaTotal_Mts:
                  type: number
                AlturaComercial_Mts:
                  type: number
                DensidadMadera:
                  type: number
                PuntoGPS:
                  type: integer
                Latitud:
                  type: number
                Longitud:
                  type: number
                ProyeccionCopa_X:
                  type: boolean
                ProyeccionCopa_Y:
                  type: boolean
                EstadoSanitario:
                  type: string
                  enum: [BUENO, REGULAR, MALO]
                PresenciaEpifitas:
                  type: boolean
                PresenciaNidos:
                  type: boolean
                PresenciaOtraFauna:
                  type: boolean
                Observaciones:
                  type: string
                Transecto:
                  type: integer
      responses:
        '201':
          description: Árbol creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExito'

  /arboles/mapa:
    get:
      summary: Obtener árboles georreferenciados para el mapa
      tags: [Árboles]
      responses:
        '200':
          description: Lista de árboles con coordenadas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    MedicionArbolID:
                      type: integer
                    NumeroArbol:
                      type: string
                    Latitud:
                      type: number
                    Longitud:
                      type: number
                    NombreComun:
                      type: string
                    NombreCientifico:
                      type: string

  /arboles/{arbol_id}:
    get:
      summary: Obtener un árbol por ID
      tags: [Árboles]
      parameters:
        - name: arbol_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Árbol encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arbol'
        '404':
          description: Árbol no encontrado
    put:
      summary: Actualizar un árbol (recalcula servicios ecosistémicos)
      tags: [Árboles]
      parameters:
        - name: arbol_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                EspecieID:
                  type: integer
                NumeroArbol:
                  type: string
                DAP_M:
                  type: number
                AlturaTotal_Mts:
                  type: number
                DensidadMadera:
                  type: number
                EstadoSanitario:
                  type: string
      responses:
        '200':
          description: Árbol actualizado
    delete:
      summary: Eliminar un árbol
      tags: [Árboles]
      parameters:
        - name: arbol_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Árbol eliminado

  /arboles/{arbol_id}/imagen:
    post:
      summary: Subir imagen para un árbol
      tags: [Árboles]
      parameters:
        - name: arbol_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imagen:
                  type: string
                  format: binary
      responses:
        '200':
          description: Imagen subida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  url:
                    type: string

  # ============================================================
  # ATRIBUTOS DINÁMICOS (para árboles)
  # ============================================================
  /atributos:
    get:
      summary: Obtener todos los atributos dinámicos
      tags: [Atributos]
      responses:
        '200':
          description: Lista de atributos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AtributoDinamico'
    post:
      summary: Crear un atributo dinámico
      tags: [Atributos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtributoDinamico'
      responses:
        '201':
          description: Atributo creado

  /atributos/{id}:
    put:
      summary: Actualizar un atributo dinámico
      tags: [Atributos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtributoDinamico'
      responses:
        '200':
          description: Atributo actualizado
    delete:
      summary: Eliminar un atributo dinámico
      tags: [Atributos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Atributo eliminado

  # ============================================================
  # REPORTES
  # ============================================================
  /reportes/estadisticas-generales:
    get:
      summary: Estadísticas generales del inventario
      tags: [Reportes]
      responses:
        '200':
          description: Estadísticas generales
  /reportes/distribucion-especies:
    get:
      summary: Distribución de árboles por especie
      tags: [Reportes]
      responses:
        '200':
          description: Distribución por especie
  /reportes/estado-sanitario:
    get:
      summary: Estado sanitario de los árboles
      tags: [Reportes]
      responses:
        '200':
          description: Estado sanitario
  /reportes/top-especies-volumen:
    get:
      summary: Top 10 especies por volumen
      tags: [Reportes]
      responses:
        '200':
          description: Top especies por volumen
  /reportes/distribucion-dap:
    get:
      summary: Distribución de DAP en clases diamétricas
      tags: [Reportes]
      responses:
        '200':
          description: Distribución DAP
  /reportes/presencia-fauna:
    get:
      summary: Presencia de fauna en árboles
      tags: [Reportes]
      responses:
        '200':
          description: Presencia de fauna

  # ============================================================
  # EXPORTACIÓN DARWIN CORE
  # ============================================================
  /exportar/darwin-core:
    get:
      summary: Exportar datos en formato Darwin Core (JSON)
      tags: [Exportación]
      responses:
        '200':
          description: Datos en formato Darwin Core
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DarwinCore'
  /exportar/darwin-core/csv:
    get:
      summary: Exportar datos en formato Darwin Core (CSV)
      tags: [Exportación]
      responses:
        '200':
          description: Archivo CSV
          content:
            text/csv:
              schema:
                type: string

  # ============================================================
  # NDVI (SENTINEL-2)
  # ============================================================
  /ndvi/{latitud}/{longitud}:
    get:
      summary: Obtener NDVI por coordenadas (Sentinel-2)
      description: Calcula el NDVI para una coordenada geográfica sin guardarlo en la base de datos.
      tags: [NDVI]
      parameters:
        - name: latitud
          in: path
          required: true
          schema:
            type: string
          example: "-12.123456"
        - name: longitud
          in: path
          required: true
          schema:
            type: string
          example: "-77.123456"
      responses:
        '200':
          description: NDVI calculado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  latitud:
                    type: number
                    example: -12.123456
                  longitud:
                    type: number
                    example: -77.123456
                  ndvi:
                    type: number
                    example: 0.7234
                  fecha:
                    type: string
                    example: "2026-09-10"
                  fuente:
                    type: string
                    example: "Sentinel-2 L2A"
        '400':
          description: Coordenadas inválidas
        '500':
          description: Error al calcular NDVI

  /ndvi/arbol/{arbol_id}:
    post:
      summary: Calcular y guardar NDVI de un árbol específico
      tags: [NDVI]
      parameters:
        - name: arbol_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: NDVI calculado y guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  arbol_id:
                    type: integer
                    example: 1
                  numero_arbol:
                    type: string
                    example: "101"
                  latitud:
                    type: number
                    example: -12.123456
                  longitud:
                    type: number
                    example: -77.123456
                  ndvi:
                    type: number
                    example: 0.7234
                  fecha_imagen:
                    type: string
                    example: "2026-09-10"
        '404':
          description: Árbol no encontrado

  /ndvi/bulk:
    post:
      summary: Calcular NDVI masivo para todos los árboles pendientes
      tags: [NDVI]
      responses:
        '200':
          description: Proceso completado

  /ndvi/estadisticas:
    get:
      summary: Estadísticas de NDVI agrupadas por Estado Sanitario
      tags: [NDVI]
      responses:
        '200':
          description: Estadísticas calculadas

  # ============================================================
  # ADMINISTRACIÓN (estructura de tablas)
  # ============================================================
  /admin/estructura/{tabla}:
    get:
      summary: Obtener la estructura de una tabla
      tags: [Administración]
      parameters:
        - name: tabla
          in: path
          required: true
          schema:
            type: string
            enum: [Info_arboles, Especies, Usuarios, Roles]
      responses:
        '200':
          description: Estructura de la tabla
        '403':
          description: Tabla no permitida

components:
  securitySchemes:
    X-UsuarioID:
      type: apiKey
      in: header
      name: X-UsuarioID
      description: ID del usuario autenticado (ej. 1).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RespuestaExito:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: integer

    Usuario:
      type: object
      properties:
        UsuarioID:
          type: integer
        Usuario:
          type: string
        RolID:
          type: integer

    Especie:
      type: object
      properties:
        EspecieID:
          type: integer
        NombreComun:
          type: string
        NombreCientifico:
          type: string
        Familia:
          type: string
        Categoria:
          type: string
        UsuarioID:
          type: integer
        fecha_creacion:
          type: string
          format: date-time
        fecha_actualizacion:
          type: string
          format: date-time

    Arbol:
      type: object
      properties:
        MedicionArbolID:
          type: integer
        EspecieID:
          type: integer
        NumeroArbol:
          type: string
        DAP_M:
          type: number
        AlturaTotal_Mts:
          type: number
        DensidadMadera:
          type: number
        BiomasaAerea_kg:
          type: number
        Carbono_kg:
          type: number
        CO2e_kg:
          type: number
        AreaBasal_M2:
          type: number
        DAP_M_REDONDEO:
          type: number
        VolumenTotal_M3:
          type: number
        Latitud:
          type: number
        Longitud:
          type: number
        EstadoSanitario:
          type: string
        NDVI:
          type: number
        NDVI_fecha:
          type: string
          format: date
        ImagenURL:
          type: string

    AtributoDinamico:
      type: object
      properties:
        MedicionArbolID:
          type: integer
        NombreCampo:
          type: string
        ValorTexto:
          type: string
        ValorNumero:
          type: number
        ValorFecha:
          type: string
          format: date
        ValorBooleano:
          type: boolean

    DarwinCore:
      type: object
      properties:
        dwc:occurrenceID:
          type: string
        dwc:scientificName:
          type: string
        dwc:decimalLatitude:
          type: number
        dwc:decimalLongitude:
          type: number
        dwc:geodeticDatum:
          type: string
        dwc:eventDate:
          type: string
        dwc:organismQuantity:
          type: integer
        dwc:organismQuantityType:
          type: string
        dwc:healthState:
          type: string